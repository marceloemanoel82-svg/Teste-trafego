<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Simulador Consórcio x Financiamento</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(180deg, #020617, #0f172a);
    padding: 18px;
}

.container {
    max-width: 420px;
    margin: auto;
    background: #ffffff;
    border-radius: 22px;
    padding: 20px;
    box-shadow: 0 20px 45px rgba(0,0,0,.35);
}

h1 {
    text-align: center;
    font-size: 22px;
    margin-bottom: 6px;
}

.subtitle {
    text-align: center;
    font-size: 14px;
    color: #6b7280;
    margin-bottom: 18px;
}

label {
    font-size: 14px;
    font-weight: 600;
    margin-top: 14px;
    display: block;
}

input, select {
    width: 100%;
    padding: 14px;
    margin-top: 6px;
    border-radius: 14px;
    border: 1px solid #d1d5db;
    font-size: 16px;
}

.helper {
    font-size: 12px;
    color: #6b7280;
    margin-top: 4px;
}

.helper strong {
    color: #dc2626;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(90deg, #2563eb, #38bdf8);
    border: none;
    border-radius: 16px;
}

.resultado {
    margin-top: 22px;
}

.card {
    background: #f8fafc;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
}

.card h3 {
    font-size: 16px;
    margin-bottom: 10px;
}

.linha {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 6px;
}

.valor {
    font-weight: 700;
}

.consorcio {
    border-left: 6px solid #16a34a;
}

.financiamento {
    border-left: 6px solid #2563eb;
}

.badge {
    padding: 14px;
    border-radius: 16px;
    text-align: center;
    font-size: 15px;
    font-weight: 800;
}
</style>
</head>

<body>

<div class="container">
    <h1>Simulador Financeiro</h1>
    <div class="subtitle">Consórcio x Financiamento</div>

    <label>Tipo de Crédito</label>
    <select id="tipo">
        <option value="imobiliario">Imobiliário</option>
        <option value="veicular">Veicular</option>
    </select>

    <label>Valor da Entrada (R$)</label>
    <input type="number" id="entrada" placeholder="Ex: 50000">
    <div class="helper">
        Digite <strong>somente números</strong> (não use ponto nem vírgula)
    </div>

    <label>Prazo (meses)</label>
    <input type="number" id="meses" placeholder="Ex: 180">
    <div class="helper">
        Exemplo correto: <strong>180</strong>
    </div>

    <button onclick="simular()">Simular Agora</button>

    <div id="resultado" class="resultado"></div>
</div>

<script>
function simular() {
    var tipo = document.getElementById("tipo").value;
    var entrada = parseFloat(document.getElementById("entrada").value);
    var meses = parseInt(document.getElementById("meses").value);

    if (!entrada || !meses) {
        alert("Preencha todos os campos usando apenas números.");
        return;
    }

    // Regras do consórcio
    var cartaTotal = entrada * 10;
    var lance = cartaTotal * 0.5;
    var cartaLivre = cartaTotal * 0.5;

    var taxaConsorcio = tipo === "imobiliario" ? 0.28 : 0.19;
    var totalConsorcio = cartaLivre * (1 + taxaConsorcio);
    var parcelaConsorcio = totalConsorcio / meses;

    // Financiamento (juros mensais padrão Caixa aproximado)
    var jurosMensal = tipo === "imobiliario" ? 0.009 : 0.018;

    var parcelaFinanciamento =
        cartaLivre *
        (jurosMensal * Math.pow(1 + jurosMensal, meses)) /
        (Math.pow(1 + jurosMensal, meses) - 1);

    var totalFinanciamento = parcelaFinanciamento * meses;

    // Comparação correta
    var diferenca = Math.abs(totalFinanciamento - totalConsorcio);
    var diferencaPct = (diferenca / Math.max(totalFinanciamento, totalConsorcio)) * 100;

    var badgeTexto = "";
    var badgeCor = "";

    if (totalConsorcio < totalFinanciamento) {
        badgeTexto = `
            Consórcio é mais vantajoso<br>
            Economia de R$ ${diferenca.toLocaleString('pt-BR')}
            (${diferencaPct.toFixed(1)}%)
        `;
        badgeCor = "linear-gradient(90deg, #dcfce7, #bbf7d0)";
    } else if (totalFinanciamento < totalConsorcio) {
        badgeTexto = `
            Financiamento é mais vantajoso<br>
            Economia de R$ ${diferenca.toLocaleString('pt-BR')}
            (${diferencaPct.toFixed(1)}%)
        `;
        badgeCor = "linear-gradient(90deg, #dbeafe, #bfdbfe)";
    } else {
        badgeTexto = "As duas opções possuem o mesmo custo final.";
        badgeCor = "linear-gradient(90deg, #e5e7eb, #f3f4f6)";
    }

    document.getElementById("resultado").innerHTML = `
        <div class="card">
            <div class="linha"><span>Carta total</span><span class="valor">R$ ${cartaTotal.toLocaleString('pt-BR')}</span></div>
            <div class="linha"><span>Lance (50%)</span><span class="valor">R$ ${lance.toLocaleString('pt-BR')}</span></div>
            <div class="linha"><span>Carta livre (uso)</span><span class="valor">R$ ${cartaLivre.toLocaleString('pt-BR')}</span></div>
        </div>

        <div class="card consorcio">
            <h3>Consórcio</h3>
            <div class="linha"><span>Taxa administrativa</span><span class="valor">${(taxaConsorcio*100).toFixed(1)}%</span></div>
            <div class="linha"><span>Parcela</span><span class="valor">R$ ${parcelaConsorcio.toFixed(2)}</span></div>
            <div class="linha"><span>Total pago</span><span class="valor">R$ ${totalConsorcio.toLocaleString('pt-BR')}</span></div>
        </div>

        <div class="card financiamento">
            <h3>Financiamento</h3>
            <div class="linha"><span>Juros ao mês</span><span class="valor">${(jurosMensal*100).toFixed(2)}%</span></div>
            <div class="linha"><span>Parcela</span><span class="valor">R$ ${parcelaFinanciamento.toFixed(2)}</span></div>
            <div class="linha"><span>Total pago</span><span class="valor">R$ ${totalFinanciamento.toLocaleString('pt-BR')}</span></div>
        </div>

        <div class="badge" style="background:${badgeCor}">
            ${badgeTexto}
        </div>
    `;
}
</script>

</body>
</html>
