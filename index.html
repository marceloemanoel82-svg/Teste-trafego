<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador Consórcio x Financiamento</title>

<style>
:root {
    --azul: #1f7ae0;
    --verde: #1bbf7a;
    --cinza: #6b7280;
    --bg: #0f172a;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: 'Inter', 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #1e293b, #020617);
    color: #111;
}

.container {
    max-width: 430px;
    margin: auto;
    background: #fff;
    border-radius: 22px;
    padding: 22px;
    box-shadow: 0 30px 60px rgba(0,0,0,.45);
    animation: fadeIn .6s ease;
}

h1 {
    font-size: 22px;
    text-align: center;
    margin-bottom: 6px;
}

.subtitle {
    text-align: center;
    font-size: 14px;
    color: var(--cinza);
    margin-bottom: 18px;
}

label {
    font-size: 14px;
    font-weight: 600;
    margin-top: 12px;
    display: block;
}

input, select {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border-radius: 12px;
    border: 1px solid #e5e7eb;
    font-size: 15px;
}

button {
    width: 100%;
    margin-top: 18px;
    padding: 14px;
    font-size: 16px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    background: linear-gradient(90deg, var(--azul), #38bdf8);
    color: #fff;
    font-weight: 600;
    transition: transform .2s, box-shadow .2s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(31,122,224,.4);
}

.resultado {
    margin-top: 24px;
    animation: slideUp .6s ease;
}

.card {
    background: #f8fafc;
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 14px;
}

.card h3 {
    margin: 0 0 10px;
    font-size: 16px;
}

.linha {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin: 6px 0;
}

.valor {
    font-weight: 600;
}

.card.consorcio {
    border-left: 6px solid var(--verde);
}

.card.financiamento {
    border-left: 6px solid var(--azul);
}

.badge {
    background: #dcfce7;
    color: #166534;
    padding: 10px;
    border-radius: 14px;
    text-align: center;
    font-weight: 700;
    margin-top: 12px;
}

@keyframes fadeIn {
    from {opacity: 0;}
    to {opacity: 1;}
}

@keyframes slideUp {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>
</head>

<body>

<div class="container">
    <h1>Simulador Financeiro</h1>
    <div class="subtitle">
        Comparação real entre Consórcio e Financiamento
    </div>

    <label>Tipo de Crédito</label>
    <select id="tipo">
        <option value="imobiliario">Imobiliário</option>
        <option value="veicular">Veicular</option>
    </select>

    <label>Valor da Entrada (R$)</label>
    <input type="number" id="entrada" placeholder="Ex: 50000">

    <label>Prazo (meses)</label>
    <input type="number" id="meses" placeholder="Ex: 180">

    <button onclick="simular()">Simular Agora</button>

    <div id="resultado" class="resultado"></div>
</div>

<script>
function simular() {
    let tipo = document.getElementById("tipo").value;
    let entrada = parseFloat(document.getElementById("entrada").value);
    let meses = parseInt(document.getElementById("meses").value);

    if (!entrada || !meses) {
        alert("Preencha todos os campos.");
        return;
    }

    let cartaTotal = entrada * 10;
    let lance = cartaTotal * 0.5;
    let cartaLivre = cartaTotal * 0.5;

    let taxaConsorcio = tipo === "imobiliario" ? 0.28 : 0.19;
    let totalConsorcio = cartaLivre * (1 + taxaConsorcio);
    let parcelaConsorcio = totalConsorcio / meses;

    let jurosMensal = tipo === "imobiliario" ? 0.009 : 0.018;
    let parcelaFinanciamento =
        cartaLivre *
        (jurosMensal * Math.pow(1 + jurosMensal, meses)) /
        (Math.pow(1 + jurosMensal, meses) - 1);

    let totalFinanciamento = parcelaFinanciamento * meses;

    let economia = totalFinanciamento - totalConsorcio;
    let economiaPct = (economia / totalFinanciamento) * 100;

    document.getElementById("resultado").innerHTML = `
        <div class="card">
            <div class="linha"><span>Carta total</span><span class="valor">R$ ${cartaTotal.toLocaleString('pt-BR')}</span></div>
            <div class="linha"><span>Lance (50%)</span><span class="valor">R$ ${lance.toLocaleString('pt-BR')}</span></div>
            <div class="linha"><span>Carta livre</span><span class="valor">R$ ${cartaLivre.toLocaleString('pt-BR')}</span></div>
        </div>

        <div class="card consorcio">
            <h3>Consórcio</h3>
            <div class="linha"><span>Taxa administrativa</span><span class="valor">${(taxaConsorcio*100).toFixed(1)}%</span></div>
            <div class="linha"><span>Parcela</span><span class="valor">R$ ${parcelaConsorcio.toFixed(2)}</span></div>
            <div class="linha"><span>Total pago</span><span class="valor">R$ ${totalConsorcio.toLocaleString('pt-BR')}</span></div>
        </div>

        <div class="card financiamento">
            <h3>Financiamento</h3>
            <div class="linha"><span>Juros ao mês</span><span class="valor">${(jurosMensal*100).toFixed(2)}%</span></div>
            <div class="linha"><span>Parcela</span><span class="valor">R$ ${parcelaFinanciamento.toFixed(2)}</span></div>
            <div class="linha"><span>Total pago</span><span class="valor">R$ ${totalFinanciamento.toLocaleString('pt-BR')}</span></div>
        </div>

        <div class="badge">
            Consórcio é mais vantajoso<br>
            Economia de R$ ${economia.toLocaleString('pt-BR')} (${economiaPct.toFixed(1)}%)
        </div>
    `;
}
</script>

</body>
</html>
